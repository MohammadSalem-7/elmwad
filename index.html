</style></head><body><div class="shell"><header class="top"><a class="brand" href="#"><span class="mark">𓂀</span><span>المواد الي مش جدعه</span></a><span class="tag">Mohammad Salem</span></header><section class="hero"><div class="eyebrow">كله هنا</div><h1>موادك بشرحها ومراجعتها</h1><p>اسئله و شرح ع كله</p><div class="hero-bottom"><span class="pill" id="total">دروس مكتوبة</span><span class="pill">٥ مواد دراسية</span><span class="pill">بحث داخل الشرح</span></div></section><div class="layout"><aside class="side"><h2 class="section-title">المواد الدراسية</h2><nav class="subject-list" id="subjects"></nav></aside><main class="content"><div class="controls"><label class="search"><input id="query" type="search" placeholder="ابحث في محتوى الدروس…" autocomplete="off"></label><select class="sort" id="sort"><option value="name">ترتيب حسب الاسم</option><option value="type">ملفات PDF أولاً</option></select></div><div class="heading"><h2 id="heading">إدارة اللوجستيات</h2><span id="shown"></span></div><div class="view-tabs"><button id="contentTab" class="view-tab active">المحتوى</button><button id="questionTab" class="view-tab">الأسئلة</button></div><section class="grid" id="grid"></section><section id="questionPane" hidden></section></main></div><footer><a href="https://mohammadsalem-7.github.io/me/" target="_blank" rel="noreferrer">Mohammad Salem</a> &nbsp;|&nbsp; <a href="https://medo-ai-chi.vercel.app/" target="_blank" rel="noreferrer">Medo AI</a></footer></div><div class="viewer" id="viewer"><div class="viewer-box"><div class="viewer-head"><div class="viewer-title" id="viewerTitle"></div><div class="viewer-tools"><a id="newTab" target="_blank" rel="noreferrer">فتح في تبويب جديد</a><button class="close" id="close">إغلاق ✕</button></div></div><div class="viewer-body" id="viewerBody"></div></div></div><script>const study=[{"name":"إدارة اللوجستيات","desc":"المفهوم والوظائف والخدمات والتحديات وتأسيس الشركات والطرف الثالث.","units":[["ماهية اللوجستيات وأهدافها","المحاضرة الأولى · المفهوم والإدارة","<p>اللوجستيات تخطيط وتنفيذ ومراقبة حركة المواد الخام والمخزون والمنتجات والمعلومات من المصدر إلى نقطة الاستهلاك لتلبية متطلبات العميل بكفاءة وتكلفة فعالة.</p><h4>الأهداف</h4><ul><li>المنتج المناسب في الوقت والمكان المناسبين.</li><li>تحسين جودة الخدمة ورفع كفاءة سلسلة التوريد.</li><li>خفض التكلفة الكلية ورفع رضا العميل والربحية.</li></ul><h4>مجموعات الوظائف</h4><ul><li>تخطيط وتحليل: المحلل اللوجستي، المهندس، المستشار ومدير المشروع.</li><li>مشتريات وتعاقد ودولية: مدير المشتريات، اللوجستيات الدولية والمخزون.</li><li>تشغيل وخدمة: مدير سلسلة التوريد، مدير الخدمات وخدمة العملاء.</li></ul><div class=\"note\">لا تقارن النقل بالسعر وحده؛ احسب أثره على زمن التسليم والتخزين والتلف ومستوى الخدمة.</div>"],["الخدمات والتدفق الوارد والصادر","المحاضرة الأولى · تصنيف الأنشطة","<h4>الخدمات</h4><ul><li>التخزين وإدارة المخزون، النقل والشحن والتوزيع.</li><li>التخليص الجمركي للاستيراد والتصدير.</li><li>الخدمات الدولية، نقل المنتجات المبردة، الطوارئ والخدمات المتكاملة.</li><li>الفحص والتفتيش وإدارة الواردات والصادرات.</li></ul><table><tr><th>التدفق</th><th>الاتجاه</th><th>مثال</th></tr><tr><td>وارد</td><td>المورد إلى المصنع</td><td>مواد خام ومدخلات إنتاج</td></tr><tr><td>صادر</td><td>المنشأة إلى العميل</td><td>منتج تام وقنوات توزيع</td></tr></table><p>الصادر يبدأ بطلب البيع، ثم تجهيز المخزن والتعبئة واختيار النقل والتسليم.</p>"],["التحديات والحلول والحالات","المحاضرة الأولى · مراجعة","<h4>التحديات</h4><ul><li>أخطاء المخزون وسلسلة التوريد.</li><li>منتجات مقلدة، وتأخر معالجة الطلبات والتسليم.</li><li>ارتفاع الأسعار والضرائب وتكلفة الشحن.</li></ul><h4>المواجهة</h4><ul><li>التطوير الرقمي وتتبع الشحنات.</li><li>الاستدامة وإعادة استخدام الموارد.</li><li>شفافية الشحن وإشعارات الطلب.</li><li>متابعة الشحنة زمنيًا وجغرافيًا والاستعداد للطوارئ.</li></ul><div class=\"qa\"><b>حالة الأغذية المجمدة:</b> تلف أثناء النقل وتغير لوائح الجمارك ونقص وفائض مخزون.<span class=\"answer\">الحل: نقل مبرد ومراقبة الحرارة ومتابعة اللوائح وتحسين التنبؤ والمخزون.</span></div><div class=\"qa\"><b>حالة متجر إلكتروني:</b> تأخير وتقليد وارتفاع شحن.<span class=\"answer\">سرعة المعالجة وحماية العلامة وخفض التكلفة؛ التوصيل للعميل تدفق صادر.</span></div>"],["الشحن وتأسيس الشركة والطرف الثالث","المحاضرة التالية · بدء التشغيل","<h4>خطوات التأسيس</h4><ol><li>تحديد الخدمات والميزة التنافسية.</li><li>التسجيل والتراخيص.</li><li>الميزانية والتمويل.</li><li>المعدات والمركبات والمستودع.</li><li>تقنية لتتبع الشحنات والمركبات والتواصل.</li></ol><p><b>وكيل الشحن:</b> يتولى الشحنة وعملية نقلها. <b>وسيط الشحن:</b> ينظم الصفقة بين الأطراف ولا ينفذ النقل بنفسه.</p><h4>الطرف الثالث 3PL</h4><p>مقدم خارجي ينفذ خدمة أو مجموعة خدمات بين المورد أو المنتج (الأول) والمشتري (الثاني). تلجأ إليه المنشأة لنقص الموارد أو ضيق الوقت أو دخول مجال جديد أو خفض التكلفة.</p><ol><li>تحديد الخدمات المطلوبة.</li><li>اختيار الموردين وتقييم العروض.</li><li>التعاقد على السعر والمدة ومؤشرات الأداء.</li><li>إدارة الأداء والمراجعة.</li></ol>"],["تنفيذ الطلبات والطوارئ واللوجستيات العكسية","المحاضرة الثالثة · إدارة الأعمال اللوجستية","<p>تتناول المحاضرة إدارة تنفيذ الطلبات، ولوجستية الطوارئ، وعلاقة الإدارة اللوجستية بالتجارة الإلكترونية والخدمات العكسية، ثم عوامل النجاح والتقنيات الحديثة والميزة التنافسية.</p><h4>إدارة تنفيذ الطلبات</h4><p>هي الأنشطة المرتبطة بإدارة المخزون وأوامر التعبئة والشحن، من استقبال طلب العميل حتى تسليمه ومتابعة المرتجعات.</p><ol><li>استلام شحنات المخزون وفرزها وتخزينها.</li><li>رصد مستويات المخزون وحل مشكلاته.</li><li>معالجة الطلبات من قنوات البيع المختلفة وتحرير طلبات العملاء.</li><li>مقارنة معدلات الشحن بين شركات الطيران وتتبع الطلبات ببيانات الشحنة.</li><li>متابعة التسليم ومعالجة البضائع المعادة وإعادة تخزينها.</li></ol><h4>لوجستية الطوارئ</h4><p>ترتيب نقل البضائع بسرعة في حالات الطوارئ، مثل نفاد مستلزمات الإنتاج أو تأخر الإنتاج بسبب عطل في الماكينات، وقد يتطلب ذلك معدات متخصصة.</p><h4>التجارة الإلكترونية والخدمات العكسية</h4><p>تشمل الإدارة اللوجستية تنسيق الموارد والبضائع، وشراء المواد الخام وتخزينها، وإدارة المخزون والمعدات والطلبات، ونقل الشحنات للعملاء محليًا أو دوليًا. أما الخدمات العكسية فهي حركة المنتجات من المستهلك عبر سلسلة التوريد إلى الجهة المناسبة، وتشمل المرتجعات والصيانة والإصلاح والتجديد وإعادة البيع أو التدوير والتخلص.</p><h4>عوامل النجاح وأهمية الإدارة</h4><ul><li>استخدام التقنيات الحديثة، ورفع كفاءة العاملين، والتعلم من الأخطاء، ووضع خطط شاملة للطوارئ.</li><li>تحسين كفاءة التسليم، وتفادي التأخير، وتقليل نفقات الإرجاع والتلف، ورفع رضا العملاء.</li></ul><h4>التقنيات الحديثة</h4><ul><li>GPS لمتابعة المركبات والشحنات وتحسين استهلاك الوقود والأمان.</li><li>الذكاء الاصطناعي للتنبؤ بالطلب وتحسين المسارات وإدارة المخزون.</li><li>أنظمة WMS والروبوتات لفرز البضائع وتخزينها وتجهيزها.</li><li>إنترنت الأشياء IoT لمراقبة الشحنات، مثل حرارة الأغذية أثناء النقل.</li><li>منصات المعلومات والاتصالات لربط الموردين والجمارك والعملاء.</li></ul><h4>الميزة التنافسية</h4><p>التميز اللوجستي هو تفرد المؤسسة في تقديم خدمة أو منتج بما يدعم استراتيجيتها ويحقق ميزة تنافسية. ومن خصائص المؤسسة المتميزة: رضا العملاء، والتنمية المستدامة، والقدرة التنظيمية، والإبداع والابتكار، والرؤية والرسالة، والتخطيط المرن، والحفاظ على التميز.</p>"]]},{"name":"اقتصاد","desc":"مبادئ الاقتصاد والندرة والاختيار والطلب والعوامل المؤثرة فيه.","units":[["مبادئ الاقتصاد والموارد","ملاحظات المبادئ · ١٤ أكتوبر","<p>علم الاقتصاد يدرس تحقيق الرفاه عبر الاستخدام الأمثل للموارد النادرة. المشكلة الاقتصادية ناتجة عن تعدد الحاجات ومحدودية الموارد.</p><ul><li>الحاجات متعددة ومتجددة؛ الموارد محدودة؛ والاختيار مفاضلة بين بدائل.</li><li>تكلفة الفرصة البديلة: قيمة أفضل بديل نتنازل عنه عند اختيار آخر.</li></ul><h4>الموارد</h4><ul><li>طبيعية: الأرض والماء والمعادن والطاقة.</li><li>بشرية: العمالة والمهارات والخبرات.</li><li>رأس المال: الآلات والمعدات والمباني.</li></ul><p>الاقتصاد الجزئي يدرس الأفراد والمنشآت والأسواق، والكلي يدرس الاقتصاد على مستوى المجتمع. التطبيقات: التجارة والصناعة والزراعة والخدمات.</p>"],["الطلب وقانونه ومنحناه","ملاحظات الطلب · التعريف والجدول","<p>الطلب كمية يرغب المستهلك في شرائها ويقدر عليها عند أسعار مختلفة خلال فترة زمنية.</p><h4>قانون الطلب</h4><p>مع ثبات العوامل الأخرى، العلاقة بين السعر والكمية المطلوبة عكسية.</p><div class=\"formula\">السعر ↑ ← الكمية المطلوبة ↓ | السعر ↓ ← الكمية المطلوبة ↑</div><p>السعر على المحور الرأسي والكمية على الأفقي؛ منحنى الطلب المعتاد ينحدر من أعلى اليسار إلى أسفل اليمين.</p><table><tr><th>السعر</th><th>الكمية</th></tr><tr><td>٢</td><td>١٠</td></tr><tr><td>٤</td><td>٨</td></tr><tr><td>٦</td><td>٦</td></tr><tr><td>٨</td><td>٤</td></tr><tr><td>١٠</td><td>٢</td></tr></table>"],["محددات الطلب والمرونة","ملاحظات الطلب · السلع العادية والرديئة","<ul><li>الدخل والأذواق والتوقعات.</li><li>عدد السكان والمشترين.</li><li>أسعار السلع البديلة والمكملة.</li></ul><table><tr><th>السلعة</th><th>أثر زيادة الدخل</th></tr><tr><td>عادية</td><td>يزداد الطلب عليها غالبًا</td></tr><tr><td>رديئة أو دنيا</td><td>قد ينخفض الطلب عليها مع التحول لبديل أفضل</td></tr></table><p>تغير سعر السلعة نفسها يسبب حركة على المنحنى. تغير الدخل أو الأذواق أو أسعار السلع المرتبطة ينقل المنحنى. المرونة السعرية تقيس استجابة الكمية المطلوبة للتغير النسبي في السعر.</p><div class=\"qa\"><b>هل تغير السعر ينقل منحنى الطلب؟</b><span class=\"answer\">لا، يسبب حركة عليه. العوامل غير السعرية هي التي تنقل المنحنى.</span></div>"]]},{"name":"تسويق","desc":"ماهية التسويق والمزيج التسويقي والبيئة ومراجعة المحاضرات.","units":[["ماهية التسويق وأهدافه","المحاضرة الأولى · المفهوم والتطور","<p>التسويق عملية إدارية واجتماعية تحدد حاجات العملاء وتخطط المنتجات والخدمات وتسعيرها وترويجها وتوزيعها، لخلق قيمة ورضا وتحقيق أهداف المنظمة عبر التبادل.</p><h4>الأهداف</h4><ul><li>الربح من خلال قيمة يرغب بها السوق.</li><li>النمو بزيادة المبيعات أو الحصة السوقية أو دخول أسواق جديدة.</li><li>البقاء والاستمرار في المنافسة.</li></ul><p>تطورت التوجهات من الإنتاج وزيادة الكفاءة إلى تحسين المنتج ثم البيع وتصريف الموجود، ثم التسويق الذي يبدأ من حاجات السوق، فالتسويق الاجتماعي الذي يراعي العميل والمجتمع.</p>"],["البيع والتسويق ووظائف التسويق","المحاضرة الأولى · مقارنة","<table><tr><th>الوجه</th><th>البيع</th><th>التسويق</th></tr><tr><td>البداية</td><td>المنظمة والمنتج</td><td>السوق وحاجة العميل</td></tr><tr><td>التركيز</td><td>تصريف المنتجات</td><td>فهم الحاجة وتقديم قيمة</td></tr><tr><td>الموقع</td><td>بعد الإنتاج غالبًا</td><td>قبل الإنتاج وبعده</td></tr><tr><td>الربح</td><td>زيادة حجم المبيعات</td><td>الرضا والولاء والشراء المتكرر</td></tr></table><h4>الوظائف</h4><ul><li>المبادلة: البيع والشراء.</li><li>النقل المادي: النقل والتوزيع والتخزين.</li><li>الترويج والتسعير.</li><li>وظائف مساندة: التمويل والائتمان وبحوث التسويق وتحمل المخاطر وخدمة ما بعد البيع.</li></ul><div class=\"note\">البيع جزء من التسويق؛ التسويق يشمل البحث والتخطيط والتوزيع والترويج والعلاقة بالعميل.</div>"],["المزيج التسويقي والسلع والخدمات","المحاضرة الأولى · 4Ps","<ul><li><b>المنتج Product:</b> سلعة أو خدمة أو فكرة تلبي حاجة.</li><li><b>السعر Price:</b> قيمة يدفعها العميل، وتوازن بين التكلفة وقبول السوق.</li><li><b>المكان Place:</b> التوزيع والنقل والتخزين والإتاحة.</li><li><b>الترويج Promotion:</b> الإعلان والبيع الشخصي وتنشيط المبيعات والعلاقات العامة.</li></ul><p>السلعة ملموسة وقد تكون استهلاكية أو إنتاجية. الخدمة منفعة غير ملموسة وقد ترتبط بسلعة، وتختلف بحسب السوق ودرجة الاتصال وطريقة التقديم وهدف مقدمها.</p>"],["البيئة التسويقية","المحاضرة الثانية · داخلية وخارجية","<p>البيئة التسويقية قوى وعوامل تؤثر في قدرة المنظمة على خدمة العملاء وقراراتها. تحليلها يكشف الفرص والتهديدات ويساعد على تكييف الاستراتيجية.</p><ul><li>داخلية: موارد المنظمة وإدارتها وأنظمتها.</li><li>قريبة: الموردون والوسطاء والعملاء والمنافسون.</li><li>اقتصادية: الدخل والأسعار والتضخم والقدرة الشرائية.</li><li>سكانية واجتماعية: الأعمار والقيم وأنماط الحياة.</li><li>تقنية وسياسية وقانونية وطبيعية.</li></ul><p>المنظمة لا تتحكم في العوامل الخارجية العامة، لكنها تراقبها وتستجيب لها.</p>"],["مراجعة وأسئلة التسويق","أوراق الأسئلة والملخصات المصورة","<div class=\"qa\"><b>ما أهداف التسويق؟</b><span class=\"answer\">الربح والنمو والبقاء.</span></div><div class=\"qa\"><b>هل التسويق هو البيع فقط؟</b><span class=\"answer\">لا، يشمل البحث والتخطيط والتسعير والتوزيع والترويج وخدمة العميل.</span></div><div class=\"qa\"><b>هل تستطيع الإدارة التحكم بالبيئة الخارجية؟</b><span class=\"answer\">لا؛ تراقبها وتحلل أثرها وتتكيّف معها.</span></div><div class=\"qa\"><b>ما عناصر 4Ps؟</b><span class=\"answer\">المنتج والسعر والمكان والترويج.</span></div>"],["البيئة التسويقية وتحليل SWOT","المحاضرة الثالثة · الفصل الثاني","<p>البيئة التسويقية هي القوى والمتغيرات داخل المؤسسة وفي محيطها الخارجي، وتؤثر في قدرة المنظمة التسويقية ومنافستها وتكيّفها مع المتغيرات. تتكون من بيئة جزئية وبيئة كلية، ولا تستطيع المنظمة التحكم في كل عناصرها.</p><h4>خصائص البيئة التسويقية</h4><ul><li>صعوبة التنبؤ بسبب نقص المعلومات والتغيرات المتسارعة.</li><li>الترابط: تغير عامل قد يؤثر مباشرة في عوامل أخرى.</li><li>الحركة والتعقيد: متغيرات مستمرة ومتفاعلة.</li><li>المنافسة الشديدة بين المنظمات على الموارد والأسواق.</li></ul><h4>البيئة الجزئية</h4><p>عوامل قريبة تؤثر مباشرة في قدرة المنظمة على خدمة العميل، وتشمل المنظمة نفسها والموردين والوسطاء والعملاء والمنافسين.</p><h4>البيئة الكلية</h4><p>قوى أوسع تخلق فرصًا وتهديدات ولا تستطيع المنظمة التحكم فيها، ومنها العوامل الاقتصادية والديموغرافية والسياسية والاجتماعية والتكنولوجية والتنافسية.</p><h4>تحليل SWOT</h4><table><tr><th>داخل المنظمة</th><th>خارج المنظمة</th></tr><tr><td>نقاط القوة ونقاط الضعف</td><td>الفرص والتهديدات</td></tr></table><p>يساعد التحليل على ربط نقاط القوة بالفرص، ومعالجة نقاط الضعف، والاستعداد للتهديدات عند بناء الخطة التسويقية.</p>"],["البيئة التسويقية: الداخلية والخارجية","المحاضرة الرابعة · تحليل العوامل المؤثرة","<p>البيئة الداخلية تقع داخل المنظمة ويمكن للإدارة التأثير فيها، بينما البيئة الخارجية تتكون من قوى خارج سيطرة المنظمة ويكون دورها تحليلها والتكيف معها. تؤثر البيئة الكلية في قطاع كامل، أما البيئة الجزئية فتؤثر مباشرة في نشاط المنظمة وعلاقتها بالسوق.</p><h4>البيئة الداخلية</h4><ul><li>الموارد والقدرات التنظيمية والهيكل التنظيمي.</li><li>القدرة التمويلية والبنية التكنولوجية المستخدمة.</li><li>عناصر المزيج التسويقي: المنتج والسعر والتوزيع والترويج.</li></ul><p>البيئة الداخلية تمثل خط الدفاع الأول، وتعتمد كفاءة الإدارة التسويقية على تكييف مواردها لمواجهة متغيرات السوق.</p><h4>عوامل البيئة الخارجية</h4><ul><li>اقتصادية: الدخل والإنفاق والادخار والاقتراض وتوزيع الدخل، وتأثيرها في القوة الشرائية والطلب.</li><li>سكانية وديموغرافية: حجم السكان وكثافتهم وتوزيع الأعمار والجنس ومستوى التعليم.</li><li>ثقافية واجتماعية: العادات والتقاليد والأدوار الاجتماعية والقيم وأنماط الاستهلاك.</li><li>تكنولوجية: الابتكار والتطور التقني وخلق أسواق جديدة أو تغيير دورة حياة المنتج.</li><li>سياسية وقانونية: قرارات وتشريعات الحكومات التي تنظم الأعمال والعلاقة بين أصحاب العمل والعاملين.</li><li>تنافسية: منافسة مباشرة بين منتجات متشابهة، أو غير مباشرة بين بدائل تلبي الحاجة نفسها.</li></ul><h4>مراحل النشاط الاقتصادي وأثرها</h4><ol><li>الرخاء: زيادة الإنفاق والتوسع في الإنتاج والتوزيع.</li><li>الركود: انخفاض الإنفاق وتحول بعض المشتريات إلى بدائل أقل تكلفة.</li><li>الكساد: انخفاض أكبر في مستويات المشتريات مع تركيز الدولة على الإجراءات المالية.</li><li>الانتعاش: عودة النشاط وزيادة القوة الشرائية تمهيدًا للرخاء.</li></ol><div class=\"note\">تراقب المنظمة القوى الخارجية باستمرار، وتكيّف قراراتها التسويقية حسب الفرص والتهديدات.</div>"]]},{"name":"قانون تجاري","desc":"تعريف القانون التجاري ومصادره ونطاق التطبيق والأعمال التجارية.","units":[["تعريف القانون التجاري ومصادره","المحاضرة الأولى · الملخص المصور","<p>القانون التجاري فرع من القانون الخاص ينظم الأعمال والمعاملات التجارية. تظهر الحاجة إليه بسبب سرعة التعامل والحاجة إلى الائتمان والثقة.</p><h4>المصادر الواردة في الملاحظات</h4><ol><li>التشريع والقواعد القانونية المكتوبة.</li><li>العرف التجاري المستقر بين المتعاملين.</li><li>المصادر العامة المكملة عند غياب النص، وفق ترتيب المنهج.</li></ol>"],["نطاق التطبيق والنظريتان","ملاحظات المحاضرات · الشخصية والموضوعية","<ul><li><b>النظرية الشخصية:</b> تركز على صفة الشخص: هل هو تاجر؟</li><li><b>النظرية الموضوعية:</b> تركز على طبيعة العمل: هل يعد تجاريًا؟</li></ul><p>التفرقة مهمة لتحديد القواعد التي تحكم التصرف وآثاره. تعرض الملاحظات طبيعة النشاط وقصد المضاربة والربح والاحتراف أو الاعتياد كمعايير للنظر بحسب نوع العمل.</p><div class=\"qa\"><b>هل يقتصر القانون التجاري دائمًا على أعمال التاجر فقط؟</b><span class=\"answer\">لا يصح إطلاق ذلك؛ تُفحص صفة الشخص وطبيعة العمل والنص المنطبق.</span></div>"],["الأعمال التجارية وأمثلتها","ملاحظات المحاضرات · العمل والتاجر","<p>الأعمال التجارية تشمل ما يحدده القانون بطبيعته، وما يكتسب الصفة التجارية لارتباطه بنشاط التاجر.</p><ul><li>شراء منقول بقصد إعادة بيعه أو تأجيره وتحقيق الربح.</li><li>التوريد والوساطة والسمسرة بحسب النشاط.</li><li>النقل والشحن والأعمال البحرية والجوية.</li><li>تأسيس الشركات وبعض الأعمال المرتبطة بها.</li><li>أعمال البنوك والصرف والأوراق التجارية.</li></ul><p>الاحتراف ممارسة النشاط بصورة معتادة ومنظمة، ويساعد في تمييزه عن التصرف العارض.</p>"],["التجاري والمدني والمراجعة","المحاضرة الثانية والثالثة · أسئلة","<table><tr><th>وجه المقارنة</th><th>تجاري</th><th>مدني</th></tr><tr><td>طبيعة العمل</td><td>عمل يكتسب الصفة التجارية قانونًا</td><td>تصرف لا يكتسبها بذاته</td></tr><tr><td>السياق</td><td>تداول أو نشاط التاجر</td><td>تصرف شخصي خارج النشاط</td></tr></table><div class=\"qa\"><b>لماذا نفرق بين العمل التجاري والمدني؟</b><span class=\"answer\">لتحديد القواعد القانونية والالتزامات والآثار المنطبقة.</span></div><div class=\"qa\"><b>هل كل شراء عمل تجاري؟</b><span class=\"answer\">لا؛ مثال الملاحظات هو شراء المنقول بقصد إعادة البيع أو التأجير والربح.</span></div>"]]},{"name":"محاسبة تكاليف","desc":"تصنيفات التكلفة وعناصر الإنتاج ومتوسط تكلفة الوحدة.","units":[["مفهوم التكلفة وتصنيفاتها","ملاحظات الدفتر · محاضرة أولى","<p>التكلفة موارد تتحملها المنشأة لإنتاج سلعة أو تقديم خدمة، وتصنيفها يساعد في القياس والرقابة والتخطيط.</p><table><tr><th>التصنيف</th><th>المعنى</th><th>مثال</th></tr><tr><td>مباشرة</td><td>ترتبط بوحدة المنتج ويسهل تتبعها</td><td>مواد وأجور مباشرة</td></tr><tr><td>غير مباشرة</td><td>تخدم أكثر من منتج</td><td>إيجار المصنع</td></tr><tr><td>ثابتة</td><td>إجماليها ثابت ضمن المدى الملائم</td><td>الإيجار</td></tr><tr><td>متغيرة</td><td>إجماليها يتغير مع الإنتاج</td><td>مواد كل وحدة</td></tr></table><div class=\"note\">مباشرة/غير مباشرة تتعلق بالتتبع؛ ثابتة/متغيرة تتعلق بسلوك التكلفة مع حجم الإنتاج.</div>"],["إجمالي التكلفة ومتوسط الوحدة","أمثلة حسابية من الملاحظات","<div class=\"formula\">المتغيرة الإجمالية = المتغيرة للوحدة × عدد الوحدات</div><div class=\"formula\">إجمالي التكلفة = الثابتة + المتغيرة الإجمالية</div><div class=\"formula\">متوسط تكلفة الوحدة = الإجمالي ÷ عدد الوحدات</div><p>مثال: ثابتة ١٠٠٠ جنيه، ومتغيرة ٥٠ جنيهًا للوحدة، وإنتاج ٢٠ وحدة.</p><ol><li>المتغيرة الإجمالية = ٥٠ × ٢٠ = ١٠٠٠.</li><li>الإجمالي = ١٠٠٠ + ١٠٠٠ = ٢٠٠٠.</li><li>متوسط الوحدة = ٢٠٠٠ ÷ ٢٠ = ١٠٠ جنيه.</li></ol>"],["عناصر التصنيع وأسئلة مراجعة","ملاحظات التكلفة · تدريب","<ul><li>المواد المباشرة تدخل في المنتج ويمكن قياسها لكل وحدة.</li><li>الأجور المباشرة تخص العاملين المشاركين في الإنتاج مباشرة.</li><li>الصناعية غير المباشرة تخدم الإنتاج ولا تخص وحدة بعينها.</li></ul><div class=\"formula\">التكلفة الأولية = المواد المباشرة + الأجور المباشرة</div><div class=\"formula\">تكلفة التصنيع = المواد المباشرة + الأجور المباشرة + الصناعية غير المباشرة</div><div class=\"qa\"><b>إيجار المصنع مباشر أم غير مباشر؟</b><span class=\"answer\">غير مباشر غالبًا؛ يخدم الإنتاج كله.</span></div><div class=\"qa\"><b>ثابتة ٦٠٠ ومتغيرة ٢٠ للوحدة عند ٣٠ وحدة؟</b><span class=\"answer\">المتغيرة ٦٠٠؛ الإجمالي ١٢٠٠؛ متوسط الوحدة ٤٠.</span></div>"]]}];const quizzes=[
